name: Build Upganam EXE

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Download platform-tools
        run: |
          curl -L -o platform-tools.zip https://dl.google.com/android/repository/platform-tools-latest-windows.zip
          tar -xf platform-tools.zip

      - name: Build EXE
        run: pyinstaller --onefile --windowed --name "Upganam" --add-binary "platform-tools\adb.exe;." --add-binary "platform-tools\AdbWinApi.dll;." --add-binary "platform-tools\AdbWinUsbApi.dll;." Upganam.py

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: Upganam-Windows
          path: dist/Upganam.exe

      - name: Create/Update Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Upganam.exe
          tag_name: v0.1
          name: Upganam v0.1
