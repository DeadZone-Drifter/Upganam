name: Build Upganam EXE

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Download platform-tools
        run: |
          curl -L -o platform-tools.zip https://dl.google.com/android/repository/platform-tools-latest-windows.zip
          tar -xf platform-tools.zip

      - name: Build EXE
        run: pyinstaller --onefile --windowed --name "Upganam" --collect-all cryptography --add-binary "platform-tools\adb.exe;." --add-binary "platform-tools\AdbWinApi.dll;." --add-binary "platform-tools\AdbWinUsbApi.dll;." Upganam.py

      - name: Extract package version
        id: get_version
        shell: bash
        run: |
          VERSION=$(python -c "import upganam; print(upganam.__version__)")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: Upganam-Windows
          path: dist/Upganam.exe

      - name: Create/Update Release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/Upganam.exe
          tag_name: v${{ steps.get_version.outputs.version }}
          name: Upganam v${{ steps.get_version.outputs.version }}
